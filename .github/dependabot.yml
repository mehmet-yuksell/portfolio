version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      tooling:
        patterns:
          ["eslint*", "prettier*", "typescript", "@types/node", "tailwindcss", "@tailwindcss/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
